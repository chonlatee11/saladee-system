# Build the LIFF SPA and deploy the static bundle to Cloudflare Pages (CDN),
# path-filtered to web changes only (D-09). The API is deployed separately by
# deploy-api.yml. No secrets touch the repo — the Cloudflare token/account id
# come from GitHub Secrets (D-11).
name: Deploy Web

on:
  workflow_dispatch: {}
  push:
    branches: [develop]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static assets
        run: bun run --cwd web build
        env:
          # API base URL for the Eden Treaty client, injected at build time.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Create the Pages project on first run (idempotent — ignore "already exists").
      - name: Ensure Cloudflare Pages project exists
        run: bunx wrangler@3.90.0 pages project create saladee-web --production-branch=develop || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=saladee-web --branch=develop
