# Deploy the Bun/Elysia API to the VPS over SSH (D-03), path-filtered so it only
# runs when api code (or this workflow) changes (D-09). Migrations run on the
# VPS after the code is pulled and BEFORE the service restarts (D-12), using the
# DIRECT/unpooled Neon URL (Pitfall 2). A hosted runner is used (D-04 — no runner
# on the prod box). The bun test suite gates the deploy (T-00-23).
name: Deploy API

on:
  workflow_dispatch: {}
  push:
    branches: [develop]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"

# Never run two API deploys concurrently against the same box.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The api integration tests (migrate/storage/health-ready) connect to a
      # PostgreSQL 17 on :55432 and MinIO on :9000 — they do NOT self-spin the
      # containers. ubuntu-latest ships Docker, so bring up the same compose
      # stacks the tests target, then wait for the ports before running bun test.
      - name: Start test services (PostgreSQL + MinIO)
        run: |
          docker compose -f api/tests/docker-compose.pg.yml -p ci_pg up -d
          docker compose -f api/tests/docker-compose.minio.yml -p ci_minio up -d
          echo "waiting for PostgreSQL :55432 …"
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/55432) 2>/dev/null && break; sleep 1; done
          echo "waiting for MinIO :9000 …"
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live >/dev/null && break; sleep 1; done

      - name: Test (deploy gate)
        working-directory: api
        run: bun test

      - name: Stop test services
        if: always()
        run: |
          docker compose -f api/tests/docker-compose.pg.yml -p ci_pg down -v || true
          docker compose -f api/tests/docker-compose.minio.yml -p ci_minio down -v || true

      - name: Deploy over SSH (pull + docker compose up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Docker deploy: the `migrate` compose service applies Drizzle migrations
          # (DIRECT/unpooled Neon url from ../api/.env) and exits before `api`
          # starts; API_DOMAIN comes from deploy/.env. The saladee user is in the
          # docker group (see provision-droplet-docker.sh), so no sudo is needed.
          script: |
            set -euo pipefail
            cd /opt/saladee && git pull --ff-only
            cd deploy && docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f || true
