# Deploy the Bun/Elysia API to the VPS over SSH (D-03), path-filtered so it only
# runs when api code (or this workflow) changes (D-09). Migrations run on the
# VPS after the code is pulled and BEFORE the service restarts (D-12), using the
# DIRECT/unpooled Neon URL (Pitfall 2). A hosted runner is used (D-04 — no runner
# on the prod box). The bun test suite gates the deploy (T-00-23).
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"

# Never run two API deploys concurrently against the same box.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (deploy gate)
        run: bun test

      - name: Deploy over SSH (pull, migrate, restart)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Migrate with the DIRECT (unpooled) Neon URL — drizzle-kit prepares
          # statements and must not go through the PgBouncer pooled endpoint.
          envs: DATABASE_URL_DIRECT
          script: |
            set -euo pipefail
            cd /opt/saladee && git pull --ff-only
            cd api && bun install --frozen-lockfile
            DATABASE_URL_DIRECT="$DATABASE_URL_DIRECT" bun run db:migrate
            sudo systemctl restart saladee-api
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
